<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashour</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
        }

        .top-bar {
            background-color: #2c3e50;
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #f39c12;
            text-decoration: none;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav-links li a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav-links li a:hover {
            color: #f39c12;
        }

        .hero {
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            color: #fff;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .products-btn {
            background-color: #f39c12;
            color: #fff;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .products-btn:hover {
            background-color: #d68910;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="home.html" class="logo">Ashour</a>
        <ul class="nav-links">
            <li><a href="home.html">الرئيسية</a></li>
            <li><a href="products.html">المنتجات</a></li>
            <li><a href="services.html">خدماتنا</a></li>
            <li><a href="contact.html">تواصل معنا</a></li>
        </ul>
    </header>

    <main class="hero">
        <h1>ورشة عاشور للألومنتال</h1>
        <p>نقدم أحدث تصميمات المطابخ، الأبواب، الشبابيك، واجهات الألومنيوم بأعلى جودة وخامات مطابقة للمواصفات.</p>
        <a href="products.html" class="products-btn">تصفح المنتجات</a>
    </main>

</body>
</html>
